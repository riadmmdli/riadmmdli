<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 900 280" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <!-- Background grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#00FFFF" stroke-width="0.15" stroke-opacity="0.25"/>
    </pattern>

    <!-- Neon glow filters -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-magenta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="blur1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="16" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow-soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="text-glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3" result="b1"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="8" result="b2"/>
      <feGaussianBlur in="SourceGraphic" stdDeviation="20" result="b3"/>
      <feMerge>
        <feMergeNode in="b3"/>
        <feMergeNode in="b2"/>
        <feMergeNode in="b1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Gradient definitions -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020508"/>
      <stop offset="50%" style="stop-color:#050505"/>
      <stop offset="100%" style="stop-color:#02040A"/>
    </linearGradient>

    <linearGradient id="titleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF">
        <animate attributeName="stop-color" values="#00FFFF;#0088FF;#7B00FF;#FF00FF;#FF0080;#00FFFF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#0088FF">
        <animate attributeName="stop-color" values="#0088FF;#7B00FF;#FF00FF;#FF0080;#00FFFF;#0088FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF00FF">
        <animate attributeName="stop-color" values="#FF00FF;#FF0080;#00FFFF;#0088FF;#7B00FF;#FF00FF" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="streakGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF;stop-opacity:0"/>
      <stop offset="40%" style="stop-color:#00FFFF;stop-opacity:0.9"/>
      <stop offset="70%" style="stop-color:#0088FF;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#0088FF;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="streakGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#FF00FF;stop-opacity:0"/>
      <stop offset="30%" style="stop-color:#FF00FF;stop-opacity:0.8"/>
      <stop offset="60%" style="stop-color:#7B00FF;stop-opacity:0.5"/>
      <stop offset="100%" style="stop-color:#7B00FF;stop-opacity:0"/>
    </linearGradient>

    <linearGradient id="streakGrad3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FF88;stop-opacity:0"/>
      <stop offset="50%" style="stop-color:#00FF88;stop-opacity:0.6"/>
      <stop offset="100%" style="stop-color:#00FF88;stop-opacity:0"/>
    </linearGradient>

    <!-- Border gradient animation -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00FFFF">
        <animate attributeName="stop-color" values="#00FFFF;#7B00FF;#FF00FF;#00FFFF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" style="stop-color:#FF00FF">
        <animate attributeName="stop-color" values="#FF00FF;#00FFFF;#7B00FF;#FF00FF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#7B00FF">
        <animate attributeName="stop-color" values="#7B00FF;#FF00FF;#00FFFF;#7B00FF" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <linearGradient id="borderGradV" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00FFFF">
        <animate attributeName="stop-color" values="#00FFFF;#FF00FF;#7B00FF;#00FFFF" dur="4s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" style="stop-color:#FF00FF">
        <animate attributeName="stop-color" values="#FF00FF;#7B00FF;#00FFFF;#FF00FF" dur="4s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Scanline pattern -->
    <pattern id="scanlines" x="0" y="0" width="900" height="4" patternUnits="userSpaceOnUse">
      <rect width="900" height="1" y="0" fill="#000000" fill-opacity="0.12"/>
      <rect width="900" height="3" y="1" fill="transparent"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bgGradient)" rx="8"/>

  <!-- Grid overlay -->
  <rect width="900" height="280" fill="url(#grid)" rx="8"/>

  <!-- Scanlines overlay -->
  <rect width="900" height="280" fill="url(#scanlines)" rx="8" opacity="0.6">
    <animate attributeName="y" from="0" to="4" dur="0.2s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner decorations - top left -->
  <line x1="10" y1="10" x2="50" y2="10" stroke="#00FFFF" stroke-width="2" filter="url(#glow-soft)">
    <animate attributeName="stroke" values="#00FFFF;#FF00FF;#00FFFF" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="10" y1="10" x2="10" y2="50" stroke="#00FFFF" stroke-width="2" filter="url(#glow-soft)">
    <animate attributeName="stroke" values="#00FFFF;#FF00FF;#00FFFF" dur="3s" repeatCount="indefinite"/>
  </line>
  <circle cx="10" cy="10" r="3" fill="#00FFFF" filter="url(#glow-cyan)">
    <animate attributeName="fill" values="#00FFFF;#FF00FF;#00FFFF" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.4;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner decorations - top right -->
  <line x1="890" y1="10" x2="850" y2="10" stroke="#FF00FF" stroke-width="2" filter="url(#glow-soft)">
    <animate attributeName="stroke" values="#FF00FF;#00FFFF;#FF00FF" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="890" y1="10" x2="890" y2="50" stroke="#FF00FF" stroke-width="2" filter="url(#glow-soft)">
    <animate attributeName="stroke" values="#FF00FF;#00FFFF;#FF00FF" dur="3s" repeatCount="indefinite"/>
  </line>
  <circle cx="890" cy="10" r="3" fill="#FF00FF" filter="url(#glow-magenta)">
    <animate attributeName="fill" values="#FF00FF;#00FFFF;#FF00FF" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Corner decorations - bottom left -->
  <line x1="10" y1="270" x2="50" y2="270" stroke="#7B00FF" stroke-width="2" filter="url(#glow-soft)">
    <animate attributeName="stroke" values="#7B00FF;#00FFFF;#7B00FF" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="10" y1="270" x2="10" y2="230" stroke="#7B00FF" stroke-width="2" filter="url(#glow-soft)">
    <animate attributeName="stroke" values="#7B00FF;#00FFFF;#7B00FF" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Corner decorations - bottom right -->
  <line x1="890" y1="270" x2="850" y2="270" stroke="#00FF88" stroke-width="2" filter="url(#glow-soft)">
    <animate attributeName="stroke" values="#00FF88;#FF00FF;#00FF88" dur="3s" repeatCount="indefinite"/>
  </line>
  <line x1="890" y1="270" x2="890" y2="230" stroke="#00FF88" stroke-width="2" filter="url(#glow-soft)">
    <animate attributeName="stroke" values="#00FF88;#FF00FF;#00FF88" dur="3s" repeatCount="indefinite"/>
  </line>

  <!-- Animated border - top -->
  <rect x="6" y="6" width="888" height="268" rx="5" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.7">
    <animate attributeName="opacity" values="0.4;0.9;0.4" dur="2s" repeatCount="indefinite"/>
  </rect>

  <!-- Moving light streak 1 - cyan -->
  <rect x="-300" y="60" width="300" height="2" rx="1" fill="url(#streakGrad1)" filter="url(#glow-cyan)" opacity="0.9">
    <animate attributeName="x" from="-300" to="1200" dur="3.5s" repeatCount="indefinite" begin="0s"/>
    <animate attributeName="opacity" values="0;0.9;0.9;0" dur="3.5s" repeatCount="indefinite"/>
  </rect>

  <!-- Moving light streak 2 - magenta -->
  <rect x="-400" y="220" width="400" height="2" rx="1" fill="url(#streakGrad2)" filter="url(#glow-magenta)" opacity="0.8">
    <animate attributeName="x" from="-400" to="1200" dur="4s" repeatCount="indefinite" begin="1s"/>
    <animate attributeName="opacity" values="0;0.8;0.8;0" dur="4s" repeatCount="indefinite" begin="1s"/>
  </rect>

  <!-- Moving light streak 3 - green accent -->
  <rect x="-200" y="140" width="200" height="1" rx="0.5" fill="url(#streakGrad3)" opacity="0.5">
    <animate attributeName="x" from="-200" to="1200" dur="5s" repeatCount="indefinite" begin="2s"/>
    <animate attributeName="opacity" values="0;0.5;0.5;0" dur="5s" repeatCount="indefinite" begin="2s"/>
  </rect>

  <!-- Second set of streaks -->
  <rect x="-300" y="100" width="250" height="1.5" rx="0.75" fill="url(#streakGrad1)" opacity="0.6">
    <animate attributeName="x" from="-300" to="1200" dur="3.5s" repeatCount="indefinite" begin="1.75s"/>
  </rect>

  <rect x="-300" y="180" width="350" height="1.5" rx="0.75" fill="url(#streakGrad2)" opacity="0.5">
    <animate attributeName="x" from="-300" to="1200" dur="4.5s" repeatCount="indefinite" begin="0.5s"/>
  </rect>

  <!-- Main title: RIAD MAMMADLI -->
  <!-- Shadow/glow layer -->
  <text x="450" y="140" text-anchor="middle" font-family="'Courier New', 'Lucida Console', monospace" font-size="62" font-weight="900" letter-spacing="8" fill="#00FFFF" opacity="0.15" filter="url(#glow-cyan)">RIAD MAMMADLI</text>

  <!-- Main title text with gradient -->
  <text x="450" y="140" text-anchor="middle" font-family="'Courier New', 'Lucida Console', monospace" font-size="62" font-weight="900" letter-spacing="8" fill="url(#titleGradient)" filter="url(#text-glow)">
    RIAD MAMMADLI
    <animate attributeName="opacity" values="1;0.88;1;0.95;1" dur="4s" repeatCount="indefinite"/>
  </text>

  <!-- Separator line with animation -->
  <line x1="200" y1="162" x2="700" y2="162" stroke="url(#borderGrad)" stroke-width="1" opacity="0.8"/>

  <!-- Subtitle -->
  <text x="450" y="195" text-anchor="middle" font-family="'Courier New', 'Lucida Console', monospace" font-size="13" font-weight="400" letter-spacing="5" fill="#A0A0C0" opacity="0.85">SOFTWARE ENGINEERING STUDENT</text>

  <!-- Accent dots around subtitle -->
  <circle cx="160" cy="191" r="2" fill="#00FFFF">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#00FFFF;#FF00FF;#00FFFF" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="740" cy="191" r="2" fill="#FF00FF">
    <animate attributeName="opacity" values="0.2;1;0.2" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="fill" values="#FF00FF;#00FFFF;#FF00FF" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Bottom tech tags -->
  <text x="450" y="230" text-anchor="middle" font-family="'Courier New', 'Lucida Console', monospace" font-size="10" letter-spacing="3" fill="#00FFFF" opacity="0.6">
    AI  ·  COMPUTER VISION  ·  MOBILE DEV  ·  NLP
  </text>

  <!-- Location indicator -->
  <text x="450" y="255" text-anchor="middle" font-family="'Courier New', 'Lucida Console', monospace" font-size="9" letter-spacing="2" fill="#7B00FF" opacity="0.5">
    ◈ KAYSERI, TURKEY  ·  ERCIYES UNIVERSITY ◈
  </text>

  <!-- Small blinking cursor element at bottom center -->
  <rect x="443" y="263" width="12" height="2" rx="1" fill="#00FFFF" opacity="0.8">
    <animate attributeName="opacity" values="0.8;0;0.8" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
